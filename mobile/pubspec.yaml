name: meridian
description: GPS-denied navigation client for the MERIDIAN IDR system.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio_cache_interceptor: ^4.0.0
  flutter_map: ^7.0.2
  flutter_map_cache: ^2.1.0
  geolocator: ^13.0.2
  http_cache_file_store: ^2.0.0
  latlong2: ^0.9.1
  sensors_plus: ^6.1.1
  provider: ^6.1.2
  tflite_flutter: ^0.12.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/meridian_compass_logo.png
  adaptive_icon_background: '#07111F'
  adaptive_icon_foreground: assets/branding/meridian_compass_logo.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/branding/meridian_compass_logo.png
    - assets/models/velocity_cnn.tflite
    - assets/models/velocity_cnn.normalization.json
    - assets/models/velocity_cnn.tflite.manifest.json
