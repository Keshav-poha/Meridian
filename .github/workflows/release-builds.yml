name: Release package builds

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-release:
    name: Android release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: Fetch Flutter packages
        working-directory: mobile
        run: flutter pub get
      - name: Build release APK
        working-directory: mobile
        run: flutter build apk --release
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: meridian-android-release-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  ios-release:
    name: iOS release compilation
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.2
          cache: true
      - name: Fetch Flutter packages
        working-directory: mobile
        run: flutter pub get
      - name: Compile unsigned iOS release
        working-directory: mobile
        run: flutter build ios --release --no-codesign
      - name: Upload unsigned iOS app bundle
        uses: actions/upload-artifact@v4
        with:
          name: meridian-ios-unsigned-release
          path: mobile/build/ios/iphoneos/Runner.app
          if-no-files-found: error
